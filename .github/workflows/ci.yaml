name: CI — Profile Generator

on:
  push:
    paths:
      - "profiles/**"
      - "tests/**"
      - ".github/workflows/ci.yaml"
  pull_request:
    paths:
      - "profiles/**"
      - "tests/**"
      - ".github/workflows/ci.yaml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install pytest

      - run: python -m pytest tests/ -q
